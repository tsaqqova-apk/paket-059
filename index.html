<html>
<head>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
var jalur_pemuatan_audio = "./sound/";
</script>
<script src="daftar.js"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">

</head>

<body>

<title>59 Alfiyah Ibnu Malik</title>
<div id="kepala-utama-id" class="kontainer-header-class">
	<button id="judul-app-id" class="judul-header-class">Alfiyah Ibnu Malik</button>
</div>

<!-- Bagian Kontroler Pemutaran Audio -->
<div class="bagianutamaaudio">
	<div class="sektordaftarisiaudio">
		<div class="tempatelemenonline" id="tempatelemenonlineid">
			<div class="intionline" id="intionlineid">
				<button onclick="setTimeout(kelinkfirebase, waktu_delay_penekanan);" id="tombolkeperpustakaanid">Tsaqqova Digital Library</button>
			</div>
		</div>
		<ul>
		<!-- Bagian List yang Nantinya Diisi oleh Rekayasa Javascript -->
		</ul>
		<button class="tombol-gdpr" onclick="setTimeout(() => Android.openPrivacySettings(), waktu_delay_penekanan)"><b>Privacy Options</b><br>(GDPR and other European regulations)</button>
	</div>
	<div class="sektorpengontrolaudio" id="sektorpengontrolaudioid">
		<div class="row">
			<div class="song-details" dir="auto">
				<p class="name"></p>
				<p class="artist" hidden></p>
			</div>
			<div class="song-timer">
				<span class="current-time">0:00</span> - <span class="max-duration">0:00</span>
			</div>
			<div class="progress-area">
				<div class="progress-bar">
					<audio id="main-audio" src=""></audio>
				</div>
			</div>
			<div class="controls">
				<i id="repeat-plist" class="material-icons" title="Playlist looped">repeat</i>
				<i id="prev" class="material-icons">skip_previous</i>
				<div class="play-pause">
					<i class="material-icons play">play_arrow</i>
				</div>
				<i id="next" class="material-icons">skip_next</i>
				<i id="tutupbagianaudioplayer" class="material-icons">apps</i>
			</div>
		</div>
	</div>
</div>
<!-- Tempat Tampil CSS Pengaktifan Elemen Perpustakaan -->
<div id="tempat-tampil-rekayasa-css-pengaktifan-elemen-perpustakaan" hidden></div>



<!-- Kode Khusus Jika Audionya Diberi File Name Arab -->
<style>
.sektordaftarisiaudio > ul > li {
direction: rtl;
}
.sektordaftarisiaudio > ul > li > div {
padding-left: 15px;
padding-right: 0px;
}
</style>
<script src="mesin-audio-online.js"></script>
<script src="kode-injek-OFF.js" defer></script>

</body>
</html>
